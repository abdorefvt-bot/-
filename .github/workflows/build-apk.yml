name: Build Mishkat APK
# Rebuild after launcher icon safe-area adjustment

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Render original SVG launcher logo at high resolution
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin python3-pil
          rsvg-convert -w 2048 -h 2048 "مِشكاة_20261123_015749_0000.svg" -o /tmp/mishkat_logo_raw.png
          python3 - <<'PY'
          from PIL import Image
          source = Image.open("/tmp/mishkat_logo_raw.png").convert("RGBA")
          # Fit the full wordmark inside Android's adaptive-icon safe circle.
          source.thumbnail((1320, 1320), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (2048, 2048), (0, 0, 0, 0))
          canvas.alpha_composite(source, ((2048-source.width)//2, (2048-source.height)//2))
          canvas.save("app/src/main/res/drawable-nodpi/mishkat_launcher_logo.png")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mishkat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
